{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Patient - {{ patient.full_name }}{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="h2">
                    <i class="fas fa-user-edit me-2"></i>
                    Edit Patient: {{ patient.full_name }}
                </h1>
                <a href="{% url 'patient_detail' patient.id %}" class="btn btn-outline-secondary">
                    <i class="fas fa-arrow-left me-1"></i> Back to Patient
                </a>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 class="card-title mb-0">
                        <i class="fas fa-edit me-2"></i>
                        Edit Patient Information
                    </h5>
                </div>
                <div class="card-body">
                    <form method="post" action="{% url 'edit_patient' patient.id %}">
                        {% csrf_token %}
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">First Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" name="first_name" value="{{ patient.first_name }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Last Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" name="last_name" value="{{ patient.last_name }}" required>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Date of Birth <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" name="date_of_birth" value="{{ patient.date_of_birth|date:'Y-m-d' }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Gender</label>
                                <select class="form-select" name="gender">
                                    <option value="M" {% if patient.gender == 'M' %}selected{% endif %}>Male</option>
                                    <option value="F" {% if patient.gender == 'F' %}selected{% endif %}>Female</option>
                                    <option value="O" {% if patient.gender == 'O' %}selected{% endif %}>Other</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Blood Type</label>
                                <select class="form-select" name="blood_type">
                                    <option value="">Select</option>
                                    <option value="A+" {% if patient.blood_type == 'A+' %}selected{% endif %}>A+</option>
                                    <option value="A-" {% if patient.blood_type == 'A-' %}selected{% endif %}>A-</option>
                                    <option value="B+" {% if patient.blood_type == 'B+' %}selected{% endif %}>B+</option>
                                    <option value="B-" {% if patient.blood_type == 'B-' %}selected{% endif %}>B-</option>
                                    <option value="O+" {% if patient.blood_type == 'O+' %}selected{% endif %}>O+</option>
                                    <option value="O-" {% if patient.blood_type == 'O-' %}selected{% endif %}>O-</option>
                                    <option value="AB+" {% if patient.blood_type == 'AB+' %}selected{% endif %}>AB+</option>
                                    <option value="AB-" {% if patient.blood_type == 'AB-' %}selected{% endif %}>AB-</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" name="patient_phone" value="{{ patient.patient_phone|default:'' }}">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="patient_email" value="{{ patient.patient_email|default:'' }}">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Allergies</label>
                            <textarea class="form-control" name="allergies" rows="2">{{ patient.allergies|default:'' }}</textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Medical Conditions</label>
                            <textarea class="form-control" name="medical_conditions" rows="2">{{ patient.medical_conditions|default:'' }}</textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Current Medications</label>
                            <textarea class="form-control" name="current_medications" rows="2">{{ patient.current_medications|default:'' }}</textarea>
                        </div>
                        
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{% url 'patient_detail' patient.id %}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-1"></i> Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
